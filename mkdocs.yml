site_name: CANOPY Documentation
site_description: Constructive Aerostructural Natural OPtimization of flYing structures
repo_url: https://github.com/VAero-Lab/CANOPY
repo_name: VAero-Lab/CANOPY

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true 

nav:
  - Home: index.md
  - Examples:
    - Example 11 (2D Flapping Wing): examples/ex11.md
    - Example 09 (3D Aero Loads): examples/ex09.md
  - API Reference:
    - Generator: api/generator.md
    - Meshing: api/meshing.md
    - Aerodynamics: api/aero_solver.md
    - Structural FEM: api/fem_solver.md
  - Advanced:
    - Julia Reproducibility: julia_reproducibility.md
