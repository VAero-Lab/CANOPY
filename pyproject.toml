[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frond"
version = "0.2.0"
description = "Fractal tree-branch wing structure generator with integrated 3D aerodynamic analysis for structural optimization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
    "scipy>=1.7",
]

[project.optional-dependencies]
fem = [
    "gmsh",
    "ccx2paraview",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
